name: Run Tests

# When to run: on every push and pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Start PostgreSQL and Redis as services (like docker-compose)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpassword123
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: ./GenAI/Projects/time-aware-rag/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Download embedding model
      - name: Download embedding model
        working-directory: ./GenAI/Projects/time-aware-rag/backend
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"

      # Step 5: Initialize database
      - name: Initialize database
        working-directory: ./GenAI/Projects/time-aware-rag/backend
        env:
          DATABASE_URL: postgresql://raguser:ragpassword123@localhost:5432/ragdb
          GEMINI_API_KEY: test-key-for-ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
          API_KEYS: rag-sk-dev-key-2024,rag-sk-admin-key-2024
        run: |
          python init_db.py

      # Step 6: Run tests
      - name: Run tests
        working-directory: ./GenAI/Projects/time-aware-rag/backend
        env:
          DATABASE_URL: postgresql://raguser:ragpassword123@localhost:5432/ragdb
          GEMINI_API_KEY: test-key-for-ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
          API_KEYS: rag-sk-dev-key-2024,rag-sk-admin-key-2024
        run: |
          pytest tests/ -v -k "not query_basic and not query_returns_sources and not query_respects_date and not date_range_query"


# Note: We skip the 4 Gemini tests in CI because GitHub Actions doesn't have your real Gemini API key. The remaining 30 tests verify everything else.